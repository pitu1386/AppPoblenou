<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <script>
        // Tema visual: "light" = Editorial rojiblanco, "dark" = Noche de partido.
        // Se aplica antes de pintar para evitar el parpadeo al cargar.
        (function () {
            var KEY = 'apn-theme';
            var colors = { light: '#FFFFFF', dark: '#0B0B0C' };
            function apply(theme) {
                var dark = theme === 'dark';
                document.documentElement.classList.toggle('dark', dark);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', dark ? colors.dark : colors.light);
            }
            var stored = null;
            try { stored = localStorage.getItem(KEY); } catch (e) { }
            var current = stored === 'dark' ? 'dark' : 'light';
            window.apnTheme = {
                get: function () { return current; },
                set: function (theme) {
                    current = theme === 'dark' ? 'dark' : 'light';
                    try { localStorage.setItem(KEY, current); } catch (e) { }
                    apply(current);
                }
            };
            document.addEventListener('DOMContentLoaded', function () { apply(current); });
            apply(current);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Atlètic Poblenou - App de Veteranos</title>
    <base href="/AppPoblenou/" />
    <link rel="icon" type="image/png" href="escudo.png" />
    <link rel="apple-touch-icon" href="escudo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- "default": iOS reserva el espacio de la barra de estado y la dibuja con contraste correcto
         (antes "black-translucent" dejaba el contenido debajo del notch / Dynamic Island). -->
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="A.P.N. Poblenou" />
    <meta name="theme-color" content="#FFFFFF" />
    <link href="manifest.webmanifest" rel="manifest" />

    <!-- Tipografías: Barlow Condensed para fechas, horas y números; Barlow para el resto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind compilado con la CLI (npm run build:css). Los tokens de color viven en css/app.css -->
    <link rel="stylesheet" href="css/tailwind.css" />
    <link rel="stylesheet" href="css/app.css" />

    <!-- Confetti para celebraciones -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <!-- Cliente Supabase solo para Realtime (los datos van por REST desde C#) -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.min.js"></script>
</head>

<body class="bg-app text-ink antialiased selection:bg-club selection:text-white min-h-screen">
    <div id="app">
        <!-- Pantalla de carga -->
        <div class="fixed inset-0 bg-app flex flex-col items-center justify-center p-6 text-center z-50">
            <div class="w-24 h-28 mb-5 animate-pulse">
                <img src="escudo.png" alt="Escudo Atlètic Poblenou" class="w-full h-full object-contain" />
            </div>
            <h1 class="font-cond font-extrabold text-[30px] leading-none tracking-wide text-ink mb-1.5">ATL&Egrave;TIC POBLENOU</h1>
            <p class="text-[13px] font-medium text-muted mb-6">Veteranos · Liga de Barcelona · desde 1929</p>
            <div class="w-40 h-1.5 apn-stripes rounded-full overflow-hidden animate-pulse"></div>
            <p class="text-xs text-faint mt-4">Cargando la plantilla...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden">
        Ha ocurrido un error inesperado.
        <a href="." class="reload text-clubtext underline">Recargar</a>
    </div>

    <script src="_framework/blazor.webassembly.w3qd1tpl0e.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            let swReg = null;
            let lastSwCheck = 0;
            const checkSwUpdate = () => {
                if (!swReg) return;
                const now = Date.now();
                if (now - lastSwCheck < 60000) return;
                lastSwCheck = now;
                swReg.update().catch(() => { });
            };

            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                swReg = reg;
                checkSwUpdate();
            });

            document.addEventListener('visibilitychange', () => {
                if (document.visibilityState === 'visible') checkSwUpdate();
            });
            window.addEventListener('pageshow', (e) => {
                if (e.persisted) checkSwUpdate();
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }

        window.forceAppUpdate = async () => {
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
            }
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const reg of registrations) {
                    await reg.unregister();
                }
            }
            window.location.reload();
        };

        window.triggerConfetti = () => {
            if (window.confetti) {
                window.confetti({ particleCount: 80, spread: 70, origin: { y: 0.6 } });
            }
        };

        window.blazorLocalStorage = {
            get: (key) => { try { return localStorage.getItem(key); } catch (e) { return null; } },
            set: (key, value) => { try { localStorage.setItem(key, value); } catch (e) { } },
            remove: (key) => { try { localStorage.removeItem(key); } catch (e) { } }
        };

        window.apnDeviceInfo = () => {
            try {
                const ua = navigator.userAgent || '';
                const os = /iPhone|iPad|iPod/i.test(ua) ? 'iOS'
                    : /Android/i.test(ua) ? 'Android'
                    : /Windows/i.test(ua) ? 'Windows'
                    : /Mac/i.test(ua) ? 'Mac' : 'Otro';
                const isPwa = (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches)
                    || window.navigator.standalone === true;
                const browser = /Edg/i.test(ua) ? 'Edge'
                    : /CriOS|Chrome/i.test(ua) ? 'Chrome'
                    : /Safari/i.test(ua) ? 'Safari'
                    : /Firefox/i.test(ua) ? 'Firefox' : 'Web';
                return `${os} · ${isPwa ? 'PWA' : browser}`;
            } catch (e) { return ''; }
        };

        // Puente de notificaciones push (Web Push). En iPhone requiere la app instalada en pantalla de inicio.
        function apnUrlB64ToUint8Array(base64String) {
            const padding = '='.repeat((4 - base64String.length % 4) % 4);
            const base64 = (base64String + padding).replace(/-/g, '+').replace(/_/g, '/');
            const raw = atob(base64);
            const arr = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; i++) arr[i] = raw.charCodeAt(i);
            return arr;
        }
        window.apnPush = {
            isSupported: () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window,
            permission: () => (window.Notification ? Notification.permission : 'unsupported'),
            currentEndpoint: async () => {
                try {
                    const reg = await navigator.serviceWorker.ready;
                    const sub = await reg.pushManager.getSubscription();
                    return sub ? sub.endpoint : null;
                } catch (e) { return null; }
            },
            subscribe: async (vapidKey) => {
                if (!window.apnPush.isSupported()) return null;
                let perm = Notification.permission;
                if (perm === 'default') perm = await Notification.requestPermission();
                if (perm !== 'granted') return JSON.stringify({ error: 'denied', permission: perm });
                const reg = await navigator.serviceWorker.ready;
                let sub = await reg.pushManager.getSubscription();
                if (!sub) {
                    sub = await reg.pushManager.subscribe({
                        userVisibleOnly: true,
                        applicationServerKey: apnUrlB64ToUint8Array(vapidKey)
                    });
                }
                const j = sub.toJSON();
                return JSON.stringify({ endpoint: sub.endpoint, p256dh: j.keys.p256dh, auth: j.keys.auth });
            },
            unsubscribe: async () => {
                try {
                    const reg = await navigator.serviceWorker.ready;
                    const sub = await reg.pushManager.getSubscription();
                    if (sub) { const e = sub.endpoint; await sub.unsubscribe(); return e; }
                } catch (e) { }
                return null;
            }
        };

        // Puente Realtime: cualquier cambio en las tablas del club avisa a C# (TeamDataService.OnCloudChange)
        // para que vuelva a leer solo esa tabla. Al volver a la app (pestaña visible) se fuerza un refresco completo.
        window.apnRealtime = (function () {
            let client = null;
            let channel = null;
            let dotnet = null;
            let timers = {};
            let visibilityHooked = false;
            let lastResumeMs = 0;
            let reconnectTimer = null;
            let manualStop = false;
            let lastConfig = null;
            let latestToken = null;
            let backoffMs = 5000;

            function notify(table) {
                if (!dotnet) return;
                clearTimeout(timers[table]);
                timers[table] = setTimeout(() => {
                    dotnet.invokeMethodAsync('OnCloudChange', table).catch(() => { });
                }, 400);
            }

            function status(connected) {
                if (dotnet) dotnet.invokeMethodAsync('OnRealtimeStatus', connected).catch(() => { });
            }

            function triggerResume() {
                if (!dotnet) return;
                const now = Date.now();
                if (now - lastResumeMs < 1500) return;
                lastResumeMs = now;
                dotnet.invokeMethodAsync('OnAppResumed').catch(() => { });
            }

            function scheduleReconnect() {
                if (manualStop || !lastConfig || reconnectTimer || navigator.onLine === false) return;
                reconnectTimer = setTimeout(() => {
                    reconnectTimer = null;
                    if (manualStop || !lastConfig) return;
                    connect(lastConfig.url, lastConfig.anonKey, latestToken, lastConfig.dotnetRef);
                }, backoffMs);
                backoffMs = Math.min(backoffMs * 2, 30000);
            }

            function cleanupSocket() {
                clearTimeout(reconnectTimer);
                reconnectTimer = null;
                const oldChannel = channel;
                const oldClient = client;
                channel = null;
                client = null;
                if (oldChannel && oldClient) { try { oldClient.removeChannel(oldChannel); } catch (e) { } }
            }

            function connect(url, anonKey, accessToken, dotnetRef) {
                cleanupSocket();
                const currentClient = window.supabase.createClient(url, anonKey, {
                    auth: { persistSession: false, autoRefreshToken: false },
                    realtime: { params: { eventsPerSecond: 5 } }
                });
                if (accessToken) currentClient.realtime.setAuth(accessToken);

                const currentChannel = currentClient.channel('apn-club')
                    .on('postgres_changes', { event: '*', schema: 'public' }, (payload) => {
                        notify(payload.table);
                    });

                client = currentClient;
                channel = currentChannel;

                currentChannel.subscribe((state) => {
                    if (channel !== currentChannel) return;
                    if (state === 'SUBSCRIBED') {
                        backoffMs = 5000;
                        status(true);
                    } else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT' || state === 'CLOSED') {
                        status(false);
                        scheduleReconnect();
                    }
                });
            }

            return {
                start: function (url, anonKey, accessToken, dotnetRef) {
                    dotnet = dotnetRef;
                    latestToken = accessToken;
                    lastConfig = { url, anonKey, dotnetRef };
                    manualStop = false;

                    if (!visibilityHooked) {
                        visibilityHooked = true;
                        document.addEventListener('visibilitychange', () => {
                            if (document.visibilityState === 'visible') triggerResume();
                        });
                        window.addEventListener('pageshow', (e) => {
                            if (e.persisted) triggerResume();
                        });
                        window.addEventListener('online', () => {
                            triggerResume();
                        });
                    }

                    if (!window.supabase || !window.supabase.createClient) {
                        status(false);
                        return false;
                    }

                    connect(url, anonKey, accessToken, dotnetRef);
                    return true;
                },
                setAuth: function (accessToken) {
                    latestToken = accessToken;
                    if (client && accessToken) client.realtime.setAuth(accessToken);
                },
                stop: function () {
                    manualStop = true;
                    cleanupSocket();
                    status(false);
                }
            };
        })();
    </script>
</body>

</html>
