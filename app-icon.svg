<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFD700"/>
      <stop offset="100%" stop-color="#D4AF37"/>
    </linearGradient>
    <linearGradient id="redGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E53935"/>
      <stop offset="100%" stop-color="#B71C1C"/>
    </linearGradient>
    <clipPath id="shieldClip">
      <path d="M256 30 C380 30 450 60 450 180 C450 330 350 440 256 480 C162 440 62 330 62 180 C62 60 132 30 256 30 Z"/>
    </clipPath>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="100" fill="#121212"/>

  <!-- Outer Shield Border Gold -->
  <path d="M256 22 C390 22 462 55 462 180 C462 340 358 456 256 496 C154 456 50 340 50 180 C50 55 122 22 256 22 Z" fill="url(#gold)"/>

  <!-- Shield Body Clipped for Stripes -->
  <g clip-path="url(#shieldClip)">
    <!-- White background -->
    <rect width="512" height="512" fill="#FFFFFF"/>
    
    <!-- Red Vertical Stripes (Rojiblanco Poblenou) -->
    <rect x="62" y="0" width="55" height="512" fill="url(#redGrad)"/>
    <rect x="172" y="0" width="56" height="512" fill="url(#redGrad)"/>
    <rect x="284" y="0" width="56" height="512" fill="url(#redGrad)"/>
    <rect x="395" y="0" width="55" height="512" fill="url(#redGrad)"/>

    <!-- Header Banner -->
    <path d="M50 0 H462 V130 H50 Z" fill="#1E1E24"/>
    <rect x="50" y="126" width="412" height="6" fill="url(#gold)"/>

    <!-- Text: ATLÈTIC POBLENOU -->
    <text x="256" y="70" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="28" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">ATLÈTIC</text>
    <text x="256" y="105" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="24" fill="url(#gold)" text-anchor="middle" letter-spacing="3">POBLENOU</text>

    <!-- Center Football Circle Badge -->
    <circle cx="256" cy="275" r="72" fill="#FFFFFF" stroke="#1E1E24" stroke-width="8"/>
    
    <!-- Classic Football Pentagons -->
    <polygon points="256,245 277,260 269,285 243,285 235,260" fill="#1E1E24"/>
    <line x1="256" y1="245" x2="256" y2="210" stroke="#1E1E24" stroke-width="5"/>
    <line x1="277" y1="260" x2="310" y2="250" stroke="#1E1E24" stroke-width="5"/>
    <line x1="269" y1="285" x2="295" y2="315" stroke="#1E1E24" stroke-width="5"/>
    <line x1="243" y1="285" x2="217" y2="315" stroke="#1E1E24" stroke-width="5"/>
    <line x1="235" y1="260" x2="202" y2="250" stroke="#1E1E24" stroke-width="5"/>

    <!-- Year 1929 Ribbon -->
    <rect x="180" y="380" width="152" height="38" rx="19" fill="#1E1E24" stroke="url(#gold)" stroke-width="3"/>
    <text x="256" y="406" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="20" fill="#FFD700" text-anchor="middle" letter-spacing="3">1929</text>
  </g>
</svg>
