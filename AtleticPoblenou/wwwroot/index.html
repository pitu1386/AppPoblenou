<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="utf-8" />
    <script>
        // Purgado inmediato e irreversible de partidos mock residuales en localStorage
        (function() {
            try {
                var rawM = localStorage.getItem('apn_matches');
                if (rawM && (rawM.indexOf('match-1') !== -1 || rawM.indexOf('match-2') !== -1 || rawM.indexOf('FONTETAS') !== -1)) {
                    localStorage.removeItem('apn_matches');
                }
                var rawA = localStorage.getItem('apn_attendance');
                if (rawA && (rawA.indexOf('match-1') !== -1 || rawA.indexOf('match-2') !== -1)) {
                    localStorage.removeItem('apn_attendance');
                }
                var rawE = localStorage.getItem('apn_events');
                if (rawE && (rawE.indexOf('match-1') !== -1 || rawE.indexOf('match-2') !== -1)) {
                    localStorage.removeItem('apn_events');
                }
            } catch(e) {}
        })();
    </script>
    <script>
        // Tema visual: "light" = Editorial rojiblanco, "dark" = Noche de partido.
        // Se aplica antes de pintar para evitar el parpadeo al cargar.
        (function () {
            var KEY = 'apn-theme';
            var colors = { light: '#FFFFFF', dark: '#0B0B0C' };
            function apply(theme) {
                var dark = theme === 'dark';
                document.documentElement.classList.toggle('dark', dark);
                var meta = document.querySelector('meta[name="theme-color"]');
                if (meta) meta.setAttribute('content', dark ? colors.dark : colors.light);
            }
            var stored = null;
            try { stored = localStorage.getItem(KEY); } catch (e) { }
            var current = stored === 'dark' ? 'dark' : 'light';
            window.apnTheme = {
                get: function () { return current; },
                set: function (theme) {
                    current = theme === 'dark' ? 'dark' : 'light';
                    try { localStorage.setItem(KEY, current); } catch (e) { }
                    apply(current);
                }
            };
            document.addEventListener('DOMContentLoaded', function () { apply(current); });
            apply(current);
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Atlètic Poblenou | A.P.N. Veteranos</title>
    <base href="/" />
    <link rel="icon" type="image/png" href="escudo.png" />
    <link rel="apple-touch-icon" href="escudo.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="A.P.N. Poblenou" />
    <meta name="theme-color" content="#FFFFFF" />
    <link href="manifest.webmanifest" rel="manifest" />

    <!-- Tipografías: Barlow Condensed para fechas, horas y números; Barlow para el resto -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // Los colores son tokens semánticos definidos como variables CSS en css/app.css.
        // Cambian con el tema (clase `dark` en <html>) sin tocar los componentes.
        const apnToken = (name) => `rgb(var(--c-${name}) / <alpha-value>)`;
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Barlow', 'Helvetica Neue', 'Helvetica', 'Arial', 'sans-serif'],
                        cond: ['"Barlow Condensed"', '"Arial Narrow"', 'Helvetica Neue', 'Arial', 'sans-serif'],
                    },
                    colors: {
                        app: apnToken('app'),
                        surface: apnToken('surface'),
                        well: apnToken('well'),
                        well2: apnToken('well2'),
                        line: apnToken('line'),
                        line2: apnToken('line2'),
                        ink: apnToken('ink'),
                        ink2: apnToken('ink2'),
                        muted: apnToken('muted'),
                        faint: apnToken('faint'),
                        club: apnToken('club'),
                        clubdeep: apnToken('clubdeep'),
                        clubtext: apnToken('clubtext'),
                        clubbg: apnToken('clubbg'),
                        ok: apnToken('ok'),
                        okdeep: apnToken('okdeep'),
                        oktext: apnToken('oktext'),
                        okbg: apnToken('okbg'),
                        warn: apnToken('warn'),
                        warntext: apnToken('warntext'),
                        warnbg: apnToken('warnbg'),
                        info: apnToken('info'),
                        infotext: apnToken('infotext'),
                        infobg: apnToken('infobg'),
                        hero: apnToken('hero'),
                        herotext: apnToken('herotext'),
                        heromuted: apnToken('heromuted'),
                        heroline: apnToken('heroline'),
                        heroline2: apnToken('heroline2'),
                        herook: apnToken('herook'),
                        heroclub: apnToken('heroclub'),
                        poblenou: {
                            red: '#E53935',
                            darkRed: '#B71C1C',
                            gold: '#F59E0B',
                            green: '#15803D',
                            blue: '#0284C7',
                            card: '#18181B',
                            dark: '#09090B',
                        }
                    }
                }
            }
        }
    </script>

    <!-- Canvas Confetti for celebrations -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>

    <link rel="stylesheet" href="css/app.css" />
    <link href="AtleticPoblenou.styles.css" rel="stylesheet" />
</head>

<body class="bg-app text-ink antialiased selection:bg-club selection:text-white min-h-screen">
    <div id="app">
        <!-- Pantalla de carga -->
        <div class="fixed inset-0 bg-app flex flex-col items-center justify-center p-6 text-center z-50">
            <div class="w-24 h-28 mb-5 animate-pulse">
                <img src="escudo.png" alt="Escudo Atlètic Poblenou" class="w-full h-full object-contain" />
            </div>
            <h1 class="font-cond font-extrabold text-[30px] leading-none tracking-wide text-ink mb-1.5">ATL&Egrave;TIC POBLENOU</h1>
            <p class="text-[13px] font-medium text-muted mb-6">Veteranos · Liga de Barcelona · desde 1929</p>
            <div class="w-40 h-1.5 apn-stripes rounded-full overflow-hidden animate-pulse"></div>
            <p class="text-xs text-faint mt-4">Cargando la plantilla...</p>
        </div>
    </div>

    <div id="blazor-error-ui" class="hidden">
        Ha ocurrido un error inesperado.
        <a href="." class="reload text-clubtext underline">Recargar</a>
    </div>

    <script src="_framework/blazor.webassembly.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js', { updateViaCache: 'none' }).then(reg => {
                reg.update();
                reg.onupdatefound = () => {
                    const installingWorker = reg.installing;
                    if (installingWorker) {
                        installingWorker.onstatechange = () => {
                            if (installingWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('Nueva versión detectada, recargando...');
                                window.location.reload();
                            }
                        };
                    }
                };
            });

            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (!refreshing) {
                    refreshing = true;
                    window.location.reload();
                }
            });
        }

        window.forceAppUpdate = async () => {
            if ('caches' in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
            }
            if ('serviceWorker' in navigator) {
                const registrations = await navigator.serviceWorker.getRegistrations();
                for (const reg of registrations) {
                    await reg.unregister();
                }
            }
            window.location.reload(true);
        };

        // Helper JS for confetti
        window.triggerConfetti = () => {
            if (window.confetti) {
                window.confetti({
                    particleCount: 80,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        };

        // Helper JS for local storage
        window.blazorLocalStorage = {
            get: (key) => localStorage.getItem(key),
            set: (key, value) => localStorage.setItem(key, value),
            remove: (key) => localStorage.removeItem(key)
        };
    </script>
</body>

</html>
